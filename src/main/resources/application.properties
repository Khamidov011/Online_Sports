spring.application.name=Online_Sports
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/online_sports
spring.datasource.username=postgres
spring.datasource.password=root123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

jwt.token.ttl=864000000
jwt.secretKey=SPORTSKEY

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.tomcat.connection-timeout=3s
security.whitelist=/auth/**,/swagger-ui/**,/swagger-ui.html,/v2/api-docs,/v3/api-docs,\
  /v3/api-docs/swagger-config,/swagger-resources/**,/webjars/**,/ws/**, /index.html,/